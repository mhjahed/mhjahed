# ──────────────────────────────────────────────────────────────
# SNAKE — animated contribution graph
# Place at:  mhjahed/mhjahed/.github/workflows/snake.yml
# Then: Actions tab → "Generate snake" → Run workflow (first time)
# Output lands on a branch called `output` — do not delete it.
# ──────────────────────────────────────────────────────────────
name: Generate snake

on:
  schedule:
    - cron: "7 */12 * * *"    # every 12 hours
  workflow_dispatch:          # manual run button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=orange&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish to `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
